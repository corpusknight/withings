<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withings callback</title>
<style>
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 48rem;
    margin: 3rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  pre {
    background: #f4f4f4;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 1rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<h1>Withings callback</h1>
<p>Withings callback - copy the URL from your address bar</p>
<pre id="query"></pre>
<script>
  document.getElementById('query').textContent =
    window.location.search || '(no query string)';
</script>
